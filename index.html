<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한마음FC 출석체크</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
.wrap { max-width: 480px; margin: 0 auto; }

.title-card { background: linear-gradient(135deg, #185fa5, #2b7fd6); border-radius: 16px; padding: 1.75rem 1.25rem; margin-bottom: 1rem; text-align: center; color: #fff; }
.club-name { font-size: 13px; opacity: 0.85; margin-bottom: 8px; letter-spacing: 0.05em; }
.big-date { font-size: 34px; font-weight: 700; line-height: 1.2; margin-bottom: 4px; }
.sub-info { font-size: 15px; opacity: 0.95; font-weight: 500; }

.duty-card { background: #fff7e6; border: 1.5px solid #ffd580; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 12px; }
.duty-icon { font-size: 28px; }
.duty-text { font-size: 13px; color: #a06a00; font-weight: 600; margin-bottom: 2px; }
.duty-name { font-size: 19px; font-weight: 700; color: #663c00; }
.duty-name .swap-note { font-size: 12px; font-weight: 500; color: #a06a00; margin-left: 6px; }
.card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.section-title { font-size: 13px; font-weight: 600; color: #444; letter-spacing: 0.02em; margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }

label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; }
.required { color: #e24b4a; margin-left: 2px; }
input[type="text"] { width: 100%; padding: 13px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; background: #fff; color: #111; }
input[type="text"]:focus { border-color: #378add; }

.status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.status-btn { border: 1.5px solid #ddd; border-radius: 10px; padding: 16px 4px; font-size: 15px; font-weight: 600; text-align: center; cursor: pointer; background: #fff; color: #111; transition: all 0.15s; user-select: none; }
.status-btn:hover { background: #f5f5f5; }
.status-btn .icon { font-size: 24px; display: block; margin-bottom: 6px; }
.status-btn.sel-attend { background: #eaf3de; color: #3b6d11; border-color: #97c459; }
.status-btn.sel-absent { background: #fcebeb; color: #a32d2d; border-color: #f09595; }
.status-btn.sel-undecided { background: #faeeda; color: #854f0b; border-color: #ef9f27; }

.submit-btn { width: 100%; padding: 16px; border-radius: 10px; border: none; background: #185fa5; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: opacity 0.15s; }
.submit-btn:hover { opacity: 0.88; }
.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.hint { font-size: 12px; color: #999; margin-top: 8px; text-align: center; }

.count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.count-card { border-radius: 10px; padding: 14px 8px; text-align: center; }
.count-card.cc-attend { background: #eaf3de; }
.count-card.cc-absent { background: #fcebeb; }
.count-card.cc-undecided { background: #faeeda; }
.count-num { font-size: 26px; font-weight: 700; }
.count-label { font-size: 12px; margin-top: 2px; font-weight: 600; }
.cnt-attend { color: #3b6d11; }
.cnt-absent { color: #a32d2d; }
.cnt-undecided { color: #854f0b; }

.divider { height: 1px; background: #f0f0f0; margin: 1rem 0; }
.member-group { margin-bottom: 1rem; }
.member-group:last-child { margin-bottom: 0; }
.group-label { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
.lbl-attend { background: #eaf3de; color: #3b6d11; }
.lbl-absent { background: #fcebeb; color: #a32d2d; }
.lbl-undecided { background: #faeeda; color: #854f0b; }
.member-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; }
.member-chip { font-size: 13px; padding: 5px 12px; border-radius: 20px; border: 1px solid #e0e0e0; background: #fff; color: #111; font-weight: 500; }
.empty-msg { font-size: 13px; color: #ccc; padding-top: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="title-card">
    <div class="club-name">⚽ 한마음 FC</div>
    <div class="big-date" id="big-date">6월 13일 토요일</div>
    <div class="sub-info">저녁 7시 풋살 출석체크</div>
  </div>

  <div class="duty-card">
    <div class="duty-icon">🧺</div>
    <div>
      <div class="duty-text">이번주 조끼 세탁 당번</div>
      <div class="duty-name" id="duty-name">불러오는 중...</div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">📝 출석 등록</p>
    <div style="margin-bottom:1.25rem;">
      <label>이름 <span class="required">*</span></label>
      <input type="text" id="name" placeholder="실명으로 입력해 주세요" />
    </div>
    <div>
      <label>출석 여부 <span class="required">*</span></label>
      <div class="status-grid">
        <div class="status-btn" id="btn-attend" onclick="selectStatus('attend')">
          <span class="icon">✓</span>출석
        </div>
        <div class="status-btn" id="btn-absent" onclick="selectStatus('absent')">
          <span class="icon">✗</span>불참
        </div>
        <div class="status-btn" id="btn-undecided" onclick="selectStatus('undecided')">
          <span class="icon">?</span>미정
        </div>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">제출하기</button>
    <p class="hint" id="status-hint"></p>
  </div>

  <div class="card">
    <p class="section-title">📊 출석 현황</p>
    <div class="count-grid">
      <div class="count-card cc-attend">
        <div class="count-num cnt-attend" id="cnt-attend">-</div>
        <div class="count-label cnt-attend">출석</div>
      </div>
      <div class="count-card cc-absent">
        <div class="count-num cnt-absent" id="cnt-absent">-</div>
        <div class="count-label cnt-absent">불참</div>
      </div>
      <div class="count-card cc-undecided">
        <div class="count-num cnt-undecided" id="cnt-undecided">-</div>
        <div class="count-label cnt-undecided">미정</div>
      </div>
    </div>
    <div class="member-group">
      <span class="group-label lbl-attend">✓ 출석</span>
      <div class="member-list" id="list-attend"><span class="empty-msg">아직 없습니다</span></div>
    </div>
    <div class="divider"></div>
    <div class="member-group">
      <span class="group-label lbl-absent">✗ 불참</span>
      <div class="member-list" id="list-absent"><span class="empty-msg">아직 없습니다</span></div>
    </div>
    <div class="divider"></div>
    <div class="member-group">
      <span class="group-label lbl-undecided">? 미정</span>
      <div class="member-list" id="list-undecided"><span class="empty-msg">아직 없습니다</span></div>
    </div>
  </div>

</div>

<script>
  const PROXY_URL = 'https://hanmaeum-attendance.min85power.workers.dev';
  let selectedStatus = null;
  let saturdayDate = '';
  function getNextSaturday() {
    const now = new Date();
    const day = now.getDay();
    const diff = (6 - day + 7) % 7 || 7;
    const sat = new Date(now);
    sat.setDate(now.getDate() + diff);
    return sat;
  }

  function formatDateStr(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function initTitle() {
    const sat = getNextSaturday();
    const month = sat.getMonth() + 1;
    const day = sat.getDate();
    saturdayDate = formatDateStr(sat);
    document.getElementById('big-date').textContent = month + '월 ' + day + '일 토요일';
  }

  function updateDuty(dutyName) {
    const el = document.getElementById('duty-name');
    if (dutyName) {
      el.textContent = dutyName;
    } else {
      el.textContent = '미정';
    }
  }

  function selectStatus(status) {
    selectedStatus = status;
    ['attend','absent','undecided'].forEach(s => {
      document.getElementById('btn-' + s).className = 'status-btn';
    });
    const cls = { attend: 'sel-attend', absent: 'sel-absent', undecided: 'sel-undecided' };
    const hints = { attend: '출석으로 등록됩니다.', absent: '불참으로 등록됩니다.', undecided: '미정으로 등록됩니다.' };
    document.getElementById('btn-' + status).className = 'status-btn ' + cls[status];
    document.getElementById('status-hint').textContent = hints[status];
  }

  function renderMembers(data) {
    const groups = { attend: [], absent: [], undecided: [] };
    (data || []).forEach(row => {
      if (groups[row.status]) groups[row.status].push(row.name);
    });
    ['attend','absent','undecided'].forEach(s => {
      document.getElementById('cnt-' + s).textContent = groups[s].length;
      const list = document.getElementById('list-' + s);
      if (groups[s].length === 0) {
        list.innerHTML = '<span class="empty-msg">아직 없습니다</span>';
      } else {
        list.innerHTML = groups[s].map(n => '<span class="member-chip">' + n + '</span>').join('');
      }
    });
  }

  function loadAttendance() {
    const cb = 'load_' + Date.now();
    window[cb] = function(data) {
      delete window[cb];
      document.getElementById('load-script') && document.getElementById('load-script').remove();
      renderMembers(data.records || []);
      updateDuty(data.duty);
    };
    const script = document.createElement('script');
    script.id = 'load-script';
    script.src = PROXY_URL + '?action=getAttendance&date=' + saturdayDate + '&callback=' + cb;
    script.onerror = function() { renderMembers([]); updateDuty(null); };
    document.body.appendChild(script);
  }

  function submitForm() {
    const name = document.getElementById('name').value.trim();
    if (!name) { alert('이름을 입력해 주세요.'); return; }
    if (!selectedStatus) { alert('출석 여부를 선택해 주세요.'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '제출 중...';

    const cb = 'submit_' + Date.now();
    window[cb] = function(result) {
      delete window[cb];
      document.getElementById('submit-script') && document.getElementById('submit-script').remove();
      btn.disabled = false;
      btn.textContent = '제출하기';
      if (result.success) {
        document.getElementById('name').value = '';
        selectedStatus = null;
        ['attend','absent','undecided'].forEach(s => {
          document.getElementById('btn-' + s).className = 'status-btn';
        });
        document.getElementById('status-hint').textContent = '';
        loadAttendance();
        updateDuty(result.duty);
        const statusText = { attend: '출석', absent: '불참', undecided: '미정' };
        alert(name + '님 ' + statusText[result.status] + ' 등록 완료!');
      } else {
        alert(result.message || '오류가 발생했습니다.');
      }
    };
    const script = document.createElement('script');
    script.id = 'submit-script';
    script.src = PROXY_URL + '?action=submitAttendance' +
      '&date=' + saturdayDate +
      '&name=' + encodeURIComponent(name) +
      '&status=' + selectedStatus +
      '&callback=' + cb;
    script.onerror = function() {
      btn.disabled = false;
      btn.textContent = '제출하기';
      alert('오류가 발생했습니다. 다시 시도해 주세요.');
    };
    document.body.appendChild(script);
  }

  initTitle();
  loadAttendance();
</script>
</body>
</html>
